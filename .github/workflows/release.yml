name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT is not subject to the "Allow GitHub Actions to create and
          # approve pull requests" restriction that blocks GITHUB_TOKEN here.
          token: ${{ secrets.CI_PAT }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        # npm >= 11.5.1 (bundled with current LTS) supports OIDC trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prepublishOnly runs typecheck, test, and build.
      # No NODE_AUTH_TOKEN: npm authenticates via OIDC against the workflow's
      # Trusted Publisher entry on npmjs.com; id-token: write is required above.
      - name: Publish to npm
        run: npm publish --provenance --access public
